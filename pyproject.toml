[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "kapps-ogm"
version = "0.1.2"
description = "Object-Graph-Mapper for KAPPS."
authors = [
    "Etienne Hoffmann <etienne.hoffmann@kit.edu>",
    "Sören Weindel <soeren.weindel@kit.edu>"
]
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = "^3.12"
rdflib = "^7.1.3"
pydantic = "^2.12.4"
# TEMPORARY dev pin, see SAWeindel/kapps_ogm#22. Published 2.0.1 rejects an asymmetric
# triples_update, which is exactly what Node.diff produces, so OGM.commit fails on any
# change that does not remove and add the same number of triples. The fix is on this
# branch but unreleased, and the next release is to carry further revisions we need this
# fix in order to develop. Revert to a published version once that release is cut.
graph_db_interface = { git = "https://github.com/SAWeindel/graph_db_interface.git", branch = "fix/bnode-identity-in-triples-update" }

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
pytest = "^8.2.0"
pylint = "^3.3.4"
deepdiff = "^9.1.0"

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "broad-exception-caught",
  "missing-function-docstring",
  "missing-module-docstring",
  "line-too-long",
  "logging-fstring-interpolation",
  "pointless-string-statement",
  "protected-access",
  "redefined-builtin",
  "too-many-ancestors",
  "too-many-arguments",
  "too-many-branches",
  "too-many-instance-attributes",
  "too-many-lines",
  "too-many-locals",
  "too-many-nested-blocks",
  "too-many-positional-arguments",
  "too-many-public-methods",
  "too-many-return-statements",
  "too-many-statements",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
log_cli = "true"
log_cli_level = "info"