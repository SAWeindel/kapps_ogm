[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "kapps-ogm"
version = "0.1.2"
description = "Object-Graph-Mapper for KAPPS."
authors = [
    "Etienne Hoffmann <etienne.hoffmann@kit.edu>",
    "Sören Weindel <soeren.weindel@kit.edu>"
]
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = "^3.12"
rdflib = "^7.1.3"
pydantic = "^2.12.4"
# The git branch pin this replaces (SAWeindel/kapps_ogm#22) held the unreleased asymmetric
# `triples_update` -- the fix `Node.diff` needs, because a diff rarely removes and adds the
# same number of triples. That fix is now published, under a new name: the library was forked
# and renamed to `kapps-triplestore-interface`, and 2.1.0 is its first release
# (kapps_semantic_middleware#133).
#
# The pin had to go, not merely age out. PyPI rejects any distribution whose metadata carries
# a direct URL, so `kapps-ogm` could not be released at all while this line named a git repo.
kapps-triplestore-interface = ">=2.1.0"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
pytest = "^8.2.0"
pylint = "^3.3.4"
deepdiff = "^9.1.0"

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "broad-exception-caught",
  "missing-function-docstring",
  "missing-module-docstring",
  "line-too-long",
  "logging-fstring-interpolation",
  "pointless-string-statement",
  "protected-access",
  "redefined-builtin",
  "too-many-ancestors",
  "too-many-arguments",
  "too-many-branches",
  "too-many-instance-attributes",
  "too-many-lines",
  "too-many-locals",
  "too-many-nested-blocks",
  "too-many-positional-arguments",
  "too-many-public-methods",
  "too-many-return-statements",
  "too-many-statements",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
log_cli = "true"
log_cli_level = "info"