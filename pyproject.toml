[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kapps-ogm"
version = "0.0.1"
description = "Object-Graph-Mapper for the Circular Factory."
authors = [
    {name = "Etienne Hoffmann", email = "etienne.hoffmann@kit.edu"},
    {name = "Sören Weindel", email = "soeren.weindel@kit.edu"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rdflib>=7.1.3",
    "pydantic>=2.12.4",
    "graph_db_interface>=1.2.0",
    "aas_middleware>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "pytest>=8.2.0",
    "pylint>=3.3.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kapps_ogm*"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "broad-exception-caught",
  "missing-function-docstring",
  "missing-module-docstring",
  "line-too-long",
  "logging-fstring-interpolation",
  "pointless-string-statement",
  "protected-access",
  "redefined-builtin",
  "too-many-ancestors",
  "too-many-arguments",
  "too-many-branches",
  "too-many-instance-attributes",
  "too-many-lines",
  "too-many-locals",
  "too-many-nested-blocks",
  "too-many-positional-arguments",
  "too-many-public-methods",
  "too-many-return-statements",
  "too-many-statements",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
log_cli = "true"
log_cli_level = "info"